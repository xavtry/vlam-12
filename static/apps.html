<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
  <title id="t">Home</title>
  <link rel="stylesheet" id="global" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/container.css?v=2" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=01" />
  <link rel="stylesheet" href="/assets/css/settings.css?v=06" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6840529569014734"
    crossorigin="anonymous"></script>
</head>
<body>
  <div class="f-nav"></div>
  <div class="main">
    <div class="settings-container">
      <!-- All your settings cards (About:Blank, Panic Key, Tab Cloaker, Custom Cloak, Background, Search Engine, Proxy, Particles, Themes, Save Data, Information) stay the same -->

      <!-- Custom Cloak Section (New) -->
      <div class="settings-card">
        <h3>Custom Cloak</h3>
        <p>Make your own cloak. Type anything you want the tab to say, and put the image URL you want as the favicon.</p>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <input id="customTitle" class="key-form" placeholder="New Title (e.g. Google, Clam, Custom)" style="flex:1">
          <input id="customIcon" class="key-form" placeholder="Favicon Image URL (e.g. https://...)" style="flex:1">
          <button class="key-button" onclick="saveCustomCloak()">Save Custom Cloak</button>
          <button class="key-button" onclick="resetCustomCloak()">Reset Custom Cloak</button>
        </div>
      </div>

      <!-- All other settings cards remain the same -->
    </div>
  </div>

  <script src="/assets/js/m1.js"></script>
  <script src="/assets/js/s1.js"></script>
  <!-- DO NOT REMOVE-->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WKJQ5QHQTJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());
    gtag("config", "G-WKJQ5QHQTJ");

    // ========== CUSTOM CLOAKER ==========
    function saveCustomCloak() {
      const title = document.getElementById('customTitle').value || "Custom Cloaked Site";
      const icon = document.getElementById('customIcon').value || "https://your-domain.com/favicon.png";

      document.title = title;
      const link = document.querySelector('link[rel="shortcut icon"]') || document.createElement('link');
      link.rel = 'shortcut icon';
      link.href = icon;
      document.head.appendChild(link);

      localStorage.setItem('customTitle', title);
      localStorage.setItem('customIcon', icon);

      console.log('%c✅ Custom Cloak Saved & Auto-Applied', 'color:#00ff9d; font-weight:bold');
    }

    function resetCustomCloak() {
      document.title = "Home";
      const link = document.querySelector('link[rel="shortcut icon"]');
      if (link) link.href = "favicon.png";
      localStorage.removeItem('customTitle');
      localStorage.removeItem('customIcon');
      console.log('%c✅ Custom Cloak Reset', 'color:#00ff9d; font-weight:bold');
    }

    window.onload = () => {
      const savedTitle = localStorage.getItem('customTitle');
      const savedIcon = localStorage.getItem('customIcon');

      if (savedTitle) document.title = savedTitle;
      if (savedIcon) {
        const link = document.querySelector('link[rel="shortcut icon"]') || document.createElement('link');
        link.rel = 'shortcut icon';
        link.href = savedIcon;
        document.head.appendChild(link);
      }
    };
  </script>
  <!-- DO NOT REMOVE-->
</body>
</html>
